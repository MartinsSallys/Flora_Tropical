<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Flora Tropical | Head shop premium em Barra Grande e Parnaíba. Curadoria, lifestyle e experiência tropical." />
  <title>Flora Tropical | Head Shop Premium</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app"></div>
  <script type="module" src="src/main.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const tourSection = document.querySelector(".virtual-tour-section");

      if (tourSection) {
        window.addEventListener("scroll", () => {
          const rect = tourSection.getBoundingClientRect();
          const offset = Math.round(rect.top * -0.035);
          tourSection.style.setProperty("--tour-parallax", `${offset}px`);
        }, { passive: true });
      }
    });
  </script>
</body>
</html>
